{% extends "base.html" %}

{% block title %}Translate — Baker Vai{% endblock %}

{% block content %}

<!-- Header -->
<div class="mb-10">
    <p class="text-xs font-semibold tracking-widest uppercase text-amber-700 mb-3">Baker Vai</p>
    <h1 class="font-display font-bold text-stone-900 leading-tight tracking-tight mb-3"
        style="font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -1px;">
        Translate.
    </h1>
    <p class="text-stone-500 text-base leading-relaxed">
        Bengali ↔ English — instant, free translation.
    </p>
</div>

<!-- Language bar -->
<div class="flex items-center gap-3 mb-4">

    <!-- Source label -->
    <div id="source-label"
         class="flex-1 text-center py-2 text-sm font-semibold text-stone-700
                bg-white border border-stone-200 rounded-xl">
        English
    </div>

    <!-- Swap button -->
    <button id="swap-btn"
            class="flex-shrink-0 w-10 h-10 flex items-center justify-center
                   bg-amber-700 text-white rounded-full text-lg font-bold
                   hover:bg-amber-800 transition-colors duration-150"
            title="Swap languages">
        ⇄
    </button>

    <!-- Target label -->
    <div id="target-label"
         class="flex-1 text-center py-2 text-sm font-semibold text-stone-700
                bg-white border border-stone-200 rounded-xl">
        বাংলা
    </div>

</div>

<!-- Text areas -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

    <!-- Input -->
    <div class="relative">
        <textarea id="input-text"
                  rows="10"
                  placeholder="Type or paste text here…"
                  class="w-full resize-none rounded-2xl border border-stone-200 bg-white
                         px-5 py-4 text-stone-900 text-base leading-relaxed
                         focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-transparent
                         placeholder:text-stone-400 transition-shadow duration-150"></textarea>
        <button id="clear-btn"
                class="absolute top-3 right-3 text-stone-300 hover:text-stone-500
                       text-xl leading-none transition-colors duration-150"
                title="Clear">✕</button>
    </div>

    <!-- Output -->
    <div class="relative">
        <textarea id="output-text"
                  rows="10"
                  readonly
                  placeholder="Translation will appear here…"
                  class="w-full resize-none rounded-2xl border border-stone-200 bg-stone-50
                         px-5 py-4 text-stone-900 text-base leading-relaxed
                         focus:outline-none placeholder:text-stone-400 cursor-default"></textarea>
        <!-- Copy button -->
        <button id="copy-btn"
                class="absolute top-3 right-3 text-stone-300 hover:text-amber-700
                       text-sm font-medium transition-colors duration-150"
                title="Copy translation">⧉</button>
    </div>

</div>

<!-- Translate button + status -->
<div class="flex items-center gap-4">
    <button id="translate-btn"
            class="px-8 py-3 bg-amber-700 hover:bg-amber-800 text-white text-sm font-semibold
                   rounded-full transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
        Translate
    </button>
    <span id="status-msg" class="text-sm text-stone-400"></span>
</div>

<script>
(function () {
    let source = 'en';   // current source language

    const inputEl      = document.getElementById('input-text');
    const outputEl     = document.getElementById('output-text');
    const swapBtn      = document.getElementById('swap-btn');
    const clearBtn     = document.getElementById('clear-btn');
    const copyBtn      = document.getElementById('copy-btn');
    const translateBtn = document.getElementById('translate-btn');
    const statusMsg    = document.getElementById('status-msg');
    const sourceLabel  = document.getElementById('source-label');
    const targetLabel  = document.getElementById('target-label');

    function updateLabels() {
        if (source === 'en') {
            sourceLabel.textContent = 'English';
            targetLabel.textContent = 'বাংলা';
            inputEl.placeholder  = 'Type or paste English text here…';
            outputEl.placeholder = 'বাংলা অনুবাদ এখানে আসবে…';
        } else {
            sourceLabel.textContent = 'বাংলা';
            targetLabel.textContent = 'English';
            inputEl.placeholder  = 'এখানে বাংলা লিখুন বা পেস্ট করুন…';
            outputEl.placeholder = 'English translation will appear here…';
        }
    }

    swapBtn.addEventListener('click', function () {
        // Swap text content too
        const tmp = inputEl.value;
        inputEl.value  = outputEl.value;
        outputEl.value = tmp;
        source = source === 'en' ? 'bn' : 'en';
        updateLabels();
        statusMsg.textContent = '';
    });

    clearBtn.addEventListener('click', function () {
        inputEl.value  = '';
        outputEl.value = '';
        statusMsg.textContent = '';
        inputEl.focus();
    });

    copyBtn.addEventListener('click', function () {
        if (!outputEl.value) return;
        navigator.clipboard.writeText(outputEl.value).then(function () {
            copyBtn.textContent = '✓';
            setTimeout(function () { copyBtn.textContent = '⧉'; }, 1500);
        });
    });

    async function doTranslate() {
        const text = inputEl.value.trim();
        if (!text) { outputEl.value = ''; return; }

        translateBtn.disabled = true;
        statusMsg.textContent = 'Translating…';
        outputEl.value = '';

        try {
            const resp = await fetch('{% url "essays:translate_api" %}', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ text: text, source: source }),
            });
            const data = await resp.json();
            if (data.error) {
                statusMsg.textContent = 'Error: ' + data.error;
            } else {
                outputEl.value        = data.translation;
                statusMsg.textContent = '✓ Done';
                setTimeout(function () { statusMsg.textContent = ''; }, 2000);
            }
        } catch (err) {
            statusMsg.textContent = 'Network error. Please try again.';
        } finally {
            translateBtn.disabled = false;
        }
    }

    translateBtn.addEventListener('click', doTranslate);

    // Ctrl+Enter / Cmd+Enter to translate
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            doTranslate();
        }
    });

    updateLabels();
})();
</script>

{% endblock %}
