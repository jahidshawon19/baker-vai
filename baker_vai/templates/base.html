<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baker Vai{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CDN with Typography plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans:    ['Inter', 'system-ui', 'sans-serif'],
                        reading: ['Lora', 'Georgia', 'serif'],
                    },
                    colors: {
                        parchment: '#fdfcf8',
                    },
                    maxWidth: {
                        '5xl': '1120px',
                    },
                }
            }
        }
    </script>

    <!-- Base body styling via plain CSS (tiny, just font + bg) -->
    <style>
        body { background-color: #fdfcf8; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans text-stone-900 antialiased leading-relaxed">

    <!-- ── NAV ── -->
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">

            <a href="/" class="font-display text-2xl font-bold text-stone-900 tracking-tight no-underline">
                বাকের&nbsp;<span class="text-amber-700">.</span>ভাই
            </a>

            <div class="flex items-center gap-1">
                <a href="/"
                   class="text-sm font-medium text-stone-500 hover:bg-stone-100 hover:text-stone-900
                          px-3 py-2 rounded-lg transition-colors duration-150">
                    Focus Writing
                </a>
            </div>

        </div>
    </nav>

    <!-- ── MAIN ── -->
    <main class="max-w-5xl mx-auto px-6 py-12 pb-20">

        {% if messages %}
        <ul class="mb-8 flex flex-col gap-2 list-none p-0">
            {% for message in messages %}
            <li class="px-4 py-3 rounded-xl text-sm font-medium
                       {% if 'success' in message.tags %}bg-green-50 text-green-800
                       {% elif 'error'   in message.tags %}bg-red-50   text-red-800
                       {% elif 'warning' in message.tags %}bg-yellow-50 text-yellow-800
                       {% else %}bg-blue-50 text-blue-800{% endif %}">
                {{ message }}
            </li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}{% endblock %}

    </main>

    <!-- ── FOOTER ── -->
    <footer class="border-t border-stone-200 py-10 px-6">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <span class="font-display text-base font-semibold text-stone-500">বাকের ভাই</span>
            <span class="text-xs text-stone-400">&copy; {% now "Y" %} — All rights reserved.</span>
        </div>
    </footer>

<!-- ── CONTENT PROTECTION ── -->
<script>
(function () {
    // Disable right-click context menu
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // Disable keyboard shortcuts
    document.addEventListener('keydown', function (e) {
        // F12 — DevTools
        if (e.key === 'F12') { e.preventDefault(); return; }

        var ctrl = e.ctrlKey || e.metaKey;

        // Ctrl+U — View Source
        // Ctrl+C — Copy
        // Ctrl+A — Select All
        // Ctrl+S — Save
        // Ctrl+P — Print
        if (ctrl && ['u', 'U', 'c', 'C', 'a', 'A', 's', 'S', 'p', 'P'].includes(e.key)) {
            e.preventDefault();
            return;
        }

        // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C — DevTools
        if (ctrl && e.shiftKey && ['i', 'I', 'j', 'J', 'c', 'C'].includes(e.key)) {
            e.preventDefault();
            return;
        }
    });

    // Disable drag-to-copy on images and text
    document.addEventListener('dragstart', function (e) {
        e.preventDefault();
    });
})();
</script>

</body>
</html>
