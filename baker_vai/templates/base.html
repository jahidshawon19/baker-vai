<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baker Vai{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #fdfcf8;
            --surface:   #ffffff;
            --border:    #e8e3db;
            --border-lt: #f0ece6;
            --text:      #1c1917;
            --muted:     #78716c;
            --faint:     #a8a29e;
            --accent:    #b45309;
            --accent-hv: #92400e;
            --cat-bg:    #fef3c7;
            --cat-text:  #92400e;
            --lang-bg:   #eff6ff;
            --lang-text: #1d4ed8;
            --feat-bg:   #f0fdf4;
            --feat-text: #15803d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ── NAV ── */
        .site-nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .nav-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .brand span { color: var(--accent); }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-links a:hover {
            background: var(--border-lt);
            color: var(--text);
        }
        .nav-links .nav-admin {
            background: var(--text);
            color: #fff !important;
            margin-left: 0.5rem;
        }
        .nav-links .nav-admin:hover {
            background: #374151;
        }

        /* ── MAIN ── */
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        /* ── MESSAGES ── */
        .messages { list-style: none; margin-bottom: 2rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .messages li {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .messages .success { background: #dcfce7; color: #166534; }
        .messages .error   { background: #fee2e2; color: #991b1b; }
        .messages .warning { background: #fef9c3; color: #854d0e; }
        .messages .info    { background: #e0f2fe; color: #075985; }

        /* ── FOOTER ── */
        .site-footer {
            border-top: 1px solid var(--border);
            padding: 2.5rem 1.5rem;
        }
        .site-footer .footer-inner {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--faint);
        }
        .site-footer .footer-brand {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
        }

        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="/" class="brand">বাকের <span>.</span>ভাই</a>
            <div class="nav-links">
                <a href="/">Focus Writing</a>
             
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">বাকের ভাই</span>
            <span>&copy; {% now "Y" %} — All rights reserved.</span>
        </div>
    </footer>
</body>
</html>
